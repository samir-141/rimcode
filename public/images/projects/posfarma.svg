<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="PosFarma — sistema de gestión de stock e inventario">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051712"/>
      <stop offset="1" stop-color="#0a261c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="980" cy="140" r="190" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="210" cy="580" r="170" fill="#34d399" opacity="0.09" filter="url(#glow)"/>

  <!-- Panel Izquierdo: Simulación UI Sistema de Farmacia -->
  <g transform="translate(96 128)">
    <rect x="0" y="0" width="470" height="430" rx="28" fill="#0c1f17" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="26" y="28" width="160" height="12" rx="6" fill="#10b981"/>
    <rect x="26" y="56" width="100" height="8" rx="4" fill="#ffffff" opacity="0.25"/>

    <!-- Ítem Medicamento 1 -->
    <rect x="26" y="96" width="418" height="58" rx="14" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="44" y="114" width="140" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
    <rect x="44" y="128" width="80" height="6" rx="3" fill="#10b981" opacity="0.7"/>
    <rect x="336" y="112" width="90" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="381" y="127" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">STOCK OK</text>

    <!-- Ítem Medicamento 2 (Vencimiento) -->
    <rect x="26" y="170" width="418" height="58" rx="14" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="44" y="188" width="170" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="44" y="202" width="90" height="6" rx="3" fill="#f59e0b" opacity="0.7"/>
    <rect x="336" y="186" width="90" height="22" rx="11" fill="#f59e0b" opacity="0.2"/>
    <text x="381" y="201" text-anchor="middle" font-family="monospace" font-size="10" fill="#f59e0b">LOTE 60D</text>

    <!-- Ítem Medicamento 3 -->
    <rect x="26" y="244" width="418" height="58" rx="14" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="44" y="262" width="120" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="44" y="276" width="70" height="6" rx="3" fill="#22d3ee" opacity="0.7"/>
    <rect x="336" y="260" width="90" height="22" rx="11" fill="#22d3ee" opacity="0.18"/>
    <text x="381" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee">DISP 350</text>

    <!-- Tarjetas de métrica inferior -->
    <rect x="26" y="330" width="190" height="66" rx="14" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-opacity="0.35"/>
    <text x="44" y="354" font-family="monospace" font-size="10" fill="#10b981">KARDEX VALORIZADO</text>
    <text x="44" y="380" font-family="monospace" font-size="18" font-weight="700" fill="#ffffff">S/. 48,250</text>

    <rect x="254" y="330" width="190" height="66" rx="14" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="272" y="354" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.5">MERMA PREVENIDA</text>
    <text x="272" y="380" font-family="monospace" font-size="18" font-weight="700" fill="#34d399">95.4%</text>
  </g>

  <!-- Panel Derecho: Títulos y tags -->
  <g transform="translate(640 140)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#10b981" letter-spacing="4">SOFTWARE DE GESTIÓN</text>
    <text x="0" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#f4f4f5">PosFarma</text>
    <text x="0" y="140" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#c9d3cc">Inventario y punto de venta para boticas</text>

    <g transform="translate(0 210)">
      <rect x="0" y="0" width="112" height="42" rx="21" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="56" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#f4f4f5">Next.js</text>
      <rect x="124" y="0" width="108" height="42" rx="21" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="178" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#f4f4f5">NestJS</text>
      <rect x="244" y="0" width="144" height="42" rx="21" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="316" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#f4f4f5">PostgreSQL</text>
      <rect x="400" y="0" width="100" height="42" rx="21" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="450" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#f4f4f5">Prisma</text>
    </g>

    <g transform="translate(0 300)">
      <rect x="0" y="0" width="460" height="100" rx="20" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="24" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#a1a1aa">Control de fechas de caducidad y alertas de lote</text>
      <text x="24" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#a1a1aa">Punto de venta y facturación electrónica inmediata</text>
    </g>
  </g>
</svg>

