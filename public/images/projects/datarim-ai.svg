      <rect x="144" y="0" width="118" height="42" rx="21" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="203" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#f4f4f5">FastAPI</text>
      <rect x="274" y="0" width="112" height="42" rx="21" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="330" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#f4f4f5">Supabase</text>
    </g>
