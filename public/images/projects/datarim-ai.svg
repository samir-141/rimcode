    <rect x="26" y="50" width="76" height="7" rx="3.5" fill="#ffffff" opacity="0.25"/>
    <g transform="translate(26 92)" fill="#ffffff" opacity="0.08">
      <rect x="0" y="0" width="60" height="240" rx="10"/>
      <rect x="78" y="54" width="60" height="186" rx="10"/>
      <rect x="156" y="24" width="60" height="216" rx="10"/>
      <rect x="234" y="96" width="60" height="144" rx="10"/>
