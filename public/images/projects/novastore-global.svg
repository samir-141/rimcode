    <text x="0" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#f4f4f5">NovaStore</text>
    <text x="0" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#f4f4f5">Global</text>
