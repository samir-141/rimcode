<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="NovaStore Global — e-commerce headless">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f06"/>
      <stop offset="1" stop-color="#221706"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1030" cy="130" r="190" fill="#f59e0b" opacity="0.14" filter="url(#glow)"/>
  <circle cx="180" cy="610" r="180" fill="#f97316" opacity="0.10" filter="url(#glow)"/>
  <g transform="translate(96 128)">
    <rect x="0" y="0" width="470" height="420" rx="28" fill="#1b1408" stroke="#ffffff" stroke-opacity="0.12"/>
