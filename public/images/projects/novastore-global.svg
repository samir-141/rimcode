      <rect x="226" y="0" width="196" height="180" rx="18" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="244" y="18" width="160" height="98" rx="10" fill="#ffffff" opacity="0.07"/>
      <rect x="244" y="130" width="110" height="9" rx="4.5" fill="#ffffff" opacity="0.32"/>
      <rect x="244" y="150" width="52" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
    </g>
    <rect x="24" y="292" width="422" height="52" rx="14" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="44" y="326" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffd28a">Checkout en 1 paso</text>
